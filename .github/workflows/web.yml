name: Web build

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch gl4es
        run: git submodule update --init --depth 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: Build
        run: web/build.sh
      - name: Test Wasm JIT
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER: node
        run: |
          cargo test --release --target wasm32-unknown-emscripten --no-default-features --lib \
            --config 'target.wasm32-unknown-emscripten.rustflags=["-C","link-arg=vendor/gl4es/lib/libGL.a","-C","link-arg=-sINVOKE_RUN=1","-C","link-arg=-sEXIT_RUNTIME=1","-C","link-arg=-sINITIAL_MEMORY=128MB"]' \
            cpu::interp::jit::tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
