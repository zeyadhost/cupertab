<text x="440" y="90" font-size="25" fill="#EEF3FA" text-anchor="middle" class="s b"><tspan class="m">.ipsw</tspan><tspan class="s"> + root filesystem key, or an </tspan><tspan class="m">.ipa</tspan></text>
<text x="440" y="120" class="s" font-size="20" fill="#A3B3D1" text-anchor="middle">You pick them. Nothing is uploaded.</text>
