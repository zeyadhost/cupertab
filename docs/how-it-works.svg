<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 19 842 940" width="842" height="940" role="img" aria-labelledby="t d">
<title id="t">How Cupertab works</title>
<desc id="d">Your .ipsw and key, or an .ipa, are read into the browser tab. Inside touchHLE.wasm, Apple's own iOS 4 code runs unmodified on an ARMv6 interpreter written in Rust, with an opt-in JIT to WebAssembly. Its system calls go to Cupertab's emulated kernel. An .ipa app calls touchHLE's own frameworks instead. Frames go to a WebGL canvas, the mouse acts as a finger, and the browser's site storage keeps the root filesystem image, the decrypted shared cache, iOS's saved files and a lock screen snapshot for the next visit.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6A7DA3"/></marker>
</defs>
<style>
.s{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, 'Liberation Mono', monospace}.b{font-weight:700}
.pulse{opacity:0;animation:pulse 12s ease-in-out infinite}
@keyframes pulse{0%{opacity:0}5%{opacity:1}13%{opacity:.9}18%{opacity:0}100%{opacity:0}}
.q0{animation-delay:0s}
.q1{animation-delay:2s}
.q2{animation-delay:4s}
.q3{animation-delay:6s}
.q4{animation-delay:8s}
.q5{animation-delay:10s}
.dot{animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.d1{animation-name:d1;animation-duration:6s}
@keyframes d1{0%{transform:translateY(-22px);opacity:0}4%{opacity:1}22%{opacity:1}26%{transform:translateY(22px);opacity:0}100%{transform:translateY(22px);opacity:0}}
.d2{animation-name:d2;animation-duration:2.4s}
@keyframes d2{0%{transform:translateX(-22px)}50%{transform:translateX(22px)}100%{transform:translateX(-22px)}}
.d3{animation-name:d3;animation-duration:3s}
.d4{animation-name:d3;animation-duration:3s;animation-delay:-1.5s;animation-direction:reverse}
@keyframes d3{0%{transform:translateY(-26px);opacity:0}10%{opacity:1}80%{opacity:1}90%{transform:translateY(26px);opacity:0}100%{transform:translateY(26px);opacity:0}}
.d5{animation-name:d5;animation-duration:8s}
@keyframes d5{0%{transform:translateY(-26px);opacity:0}5%{opacity:1}25%{transform:translateY(26px);opacity:1}30%{opacity:0}50%{transform:translateY(26px);opacity:0}55%{opacity:1}75%{transform:translateY(-26px);opacity:1}80%{opacity:0}100%{transform:translateY(-26px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse,.dot{animation:none}}
</style>
