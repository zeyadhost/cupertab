<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>touchHLE in the browser</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #111; color: #ddd;
         display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 16px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; max-width: 640px; text-align: center; color: #aaa; }
  a { color: #8cf; }
  #picker { display: flex; gap: 12px; align-items: center; }
  label.button { background: #2a6; color: #fff; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  label.button.disabled { background: #444; cursor: default; }
  #canvas { background: #000; display: none; outline: none; }
  #status { color: #fc6; min-height: 1.5em; }
  #log { width: min(900px, 100%); height: 220px; overflow: auto; background: #000; color: #9c9;
         font: 12px/1.4 ui-monospace, monospace; padding: 8px; box-sizing: border-box;
         white-space: pre-wrap; border-radius: 6px; }
</style>
</head>
<body>
<h1>touchHLE in the browser</h1>
<p>An experimental WebAssembly build of <a href="https://touchhle.org/">touchHLE</a>, the
high-level emulator for iPhone OS 2.x&ndash;4.0 apps. Pick an <code>.ipa</code> you own; it stays
on your machine and runs entirely in this tab.</p>
<div id="picker">
  <label class="button disabled" id="pick-label">Loading&hellip;
    <input type="file" id="ipa" accept=".ipa,.zip" hidden disabled>
  </label>
</div>
<div id="status"></div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<pre id="log"></pre>
<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const input = document.getElementById('ipa');
  const label = document.getElementById('pick-label');
  function log(text) {
    logEl.textContent += text + '\n';
    if (logEl.textContent.length > 200000) logEl.textContent = logEl.textContent.slice(-100000);
    logEl.scrollTop = logEl.scrollHeight;
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    print: log,
    printErr: log,
    setStatus: (s) => { statusEl.textContent = s; },
    onRuntimeInitialized() {
      statusEl.textContent = '';
      label.firstChild.textContent = 'Choose .ipa';
      label.classList.remove('disabled');
      input.disabled = false;
    },
    onAbort(what) { statusEl.textContent = 'touchHLE crashed: ' + what; },
  };
  window.addEventListener('error', (e) => { statusEl.textContent = 'Error: ' + e.message; });
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    input.disabled = true;
    label.classList.add('disabled');
    statusEl.textContent = 'Loading ' + file.name + '…';
    const data = new Uint8Array(await file.arrayBuffer());
    const name = file.name.replace(/[^A-Za-z0-9._-]/g, '_');
    try { Module.FS.mkdir('/touchHLE_apps'); } catch (e) {}
    Module.FS.writeFile('/touchHLE_apps/' + name, data);
    statusEl.textContent = 'Running ' + file.name;
    Module.canvas.style.display = 'block';
    Module.canvas.focus();
    try {
      Module.callMain(['/touchHLE_apps/' + name]);
    } catch (e) {
      if (e !== 'unwind') { statusEl.textContent = 'touchHLE stopped: ' + e; throw e; }
    }
  });
</script>
<script src="touchHLE.data.js"></script>
<script async src="touchHLE.js"></script>
</body>
</html>
